<svg viewBox="0 0 880 560" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <title>GA Asset Inventory architecture</title>
  <rect x="0" y="0" width="880" height="560" fill="#ffffff"/>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- zone: GA internal network -->
  <rect x="20" y="52" width="392" height="400" rx="12" fill="none" stroke="#cbd5e1" stroke-dasharray="6 5"/>
  <text x="36" y="80" font-size="12" font-weight="600" fill="#64748b" letter-spacing="1">GA INTERNAL NETWORK</text>

  <rect x="48" y="104" width="150" height="64" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="123" y="131" font-size="13.5" font-weight="650" fill="#0f172a" text-anchor="middle">ITS Users</text>
  <text x="123" y="150" font-size="11" fill="#64748b" text-anchor="middle">WebApp</text>

  <rect x="48" y="216" width="336" height="76" rx="10" fill="#eff4fe"/>
  <rect x="48" y="216" width="336" height="76" rx="10" fill="none" stroke="#2563eb" stroke-width="1.6"/>
  <text x="216" y="247" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="middle">GA Asset Inventory Web App</text>
  <text x="216" y="270" font-size="11.5" fill="#64748b" text-anchor="middle">CSV import / export · REST API</text>

  <rect x="112" y="368" width="208" height="62" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="216" y="394" font-size="13.5" font-weight="650" fill="#0f172a" text-anchor="middle">MID Server</text>
  <text x="216" y="413" font-size="11" fill="#64748b" text-anchor="middle">outbound HTTPS only</text>

  <!-- zone: ServiceNow -->
  <rect x="452" y="52" width="272" height="400" rx="12" fill="none" stroke="#cbd5e1" stroke-dasharray="6 5"/>
  <text x="468" y="80" font-size="12" font-weight="600" fill="#64748b" letter-spacing="1">SERVICENOW</text>

  <rect x="480" y="104" width="216" height="60" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="588" y="129" font-size="13" font-weight="650" fill="#0f172a" text-anchor="middle">Import Set + Transform</text>
  <text x="588" y="148" font-size="11" fill="#64748b" text-anchor="middle">dedup on hostname</text>

  <rect x="480" y="206" width="216" height="88" rx="10" fill="#eff4fe"/>
  <rect x="480" y="206" width="216" height="88" rx="10" fill="none" stroke="#2563eb" stroke-width="1.6"/>
  <text x="588" y="238" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">ServiceNow CMDB</text>
  <text x="588" y="259" font-size="11.5" fill="#64748b" text-anchor="middle">governed asset tables</text>
  <text x="588" y="278" font-size="11.5" fill="#64748b" text-anchor="middle">integration hub</text>

  <rect x="480" y="338" width="216" height="60" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="588" y="363" font-size="13" font-weight="650" fill="#0f172a" text-anchor="middle">Dashboards</text>
  <text x="588" y="382" font-size="11" fill="#64748b" text-anchor="middle">quick metrics · live filters</text>

  <!-- downstream -->
  <rect x="764" y="140" width="96" height="60" rx="10" fill="none" stroke="#94a3b8" stroke-dasharray="5 4"/>
  <text x="812" y="166" font-size="13" font-weight="650" fill="#64748b" text-anchor="middle">Orion</text>
  <text x="812" y="184" font-size="10.5" fill="#94a3b8" text-anchor="middle">monitoring</text>

  <rect x="764" y="240" width="96" height="60" rx="10" fill="none" stroke="#94a3b8" stroke-dasharray="5 4"/>
  <text x="812" y="266" font-size="13" font-weight="650" fill="#64748b" text-anchor="middle">Jira</text>
  <text x="812" y="284" font-size="10.5" fill="#94a3b8" text-anchor="middle">work tracking</text>

  <!-- arrows -->
  <line x1="123" y1="168" x2="123" y2="212" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrB)"/>
  <text x="134" y="196" font-size="10.5" fill="#64748b">edit / search</text>
  <line x1="216" y1="292" x2="216" y2="364" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrB)"/>
  <path d="M 320 399 L 440 399 L 440 134 L 476 134" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrB)"/>
  <text x="346" y="390" font-size="10.5" fill="#64748b">encrypted HTTPS</text>
  <line x1="588" y1="164" x2="588" y2="202" stroke="#64748b" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="588" y1="294" x2="588" y2="334" stroke="#64748b" stroke-width="1.4" marker-end="url(#arr)"/>
  <path d="M 696 236 L 730 236 L 730 170 L 760 170" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <path d="M 696 262 L 730 262 L 730 270 L 760 270" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr)"/>

  <!-- legend -->
  <line x1="48" y1="500" x2="84" y2="500" stroke="#2563eb" stroke-width="1.6"/>
  <text x="92" y="504" font-size="11" fill="#64748b">live data flow</text>
</svg>
